name: CI

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Conn3x
        env: &gh
          GH_TOKEN: ${{ github.token }}
        run: &install |
          tag=$(gh release view -R conn3xorg/conn3x --json tagName -q .tagName)
          file="conn3x_${tag#v}_linux_amd64.tar.gz"
          cd "$RUNNER_TEMP"
          curl -sSfLO "https://github.com/conn3xorg/conn3x/releases/download/$tag/$file"
          curl -sSfLO "https://github.com/conn3xorg/conn3x/releases/download/$tag/checksums.txt"
          grep " $file\$" checksums.txt | sha256sum -c -
          mkdir -p bin && tar -xzf "$file" -C bin conn3x
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - run: conn3x version
      - run: conn3x fmt -check -recursive
      - name: Validate
        run: conn3x init -backend=false && conn3x validate
      - name: Validate the example
        working-directory: examples/local
        run: conn3x init -backend=false && conn3x validate

  # Wazuh lists Ubuntu and the Red Hat family for the server. The agents cover
  # the other two distributions the circuit supports.
  e2e:
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - server: ubuntu2404
            agent: debian13
          - server: rocky10
            agent: fedora45
          - server: ubuntu2404
            agent: rocky10
          - server: rocky10
            agent: ubuntu2404
    name: e2e (${{ matrix.server }} server, ${{ matrix.agent }} agent)
    env:
      PODMAN: sudo podman
      TF_VAR_enrollment_password: ci-only-enroll-pass
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The test host images live in the Conn3x repo.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: conn3xorg/conn3x
          ref: main
          path: conn3x
          persist-credentials: false
          sparse-checkout: test/images
      - name: Install Conn3x
        env: *gh
        run: *install
      - name: Start the hosts
        working-directory: examples/local
        env:
          CONTAINERFILE: ${{ github.workspace }}/conn3x/test/images/${{ matrix.server }}/Containerfile
          AGENT_CONTAINERFILE: ${{ github.workspace }}/conn3x/test/images/${{ matrix.agent }}/Containerfile
        run: ./up.sh
      - name: Apply, then plan again with no changes
        working-directory: examples/local
        env:
          TF_VAR_admin_password: Ci-only-admin-1.
          TF_VAR_api_password: Ci-only-api-1.
        run: |
          conn3x init
          conn3x apply -auto-approve
          conn3x plan -detailed-exitcode
      # The API takes the password and refuses others, the agent shows active,
      # and a new file on the agent becomes an alert in the indexer.
      - name: Check the API, the agent and file integrity monitoring
        env:
          ADMIN_PASSWORD: Ci-only-admin-1.
          API_PASSWORD: Ci-only-api-1.
        run: test/check.sh
      - name: Sign in to the dashboard
        run: |
          sudo podman exec circuit-wazuh-server sh -c 'curl -sk -o /dev/null -w "%{http_code}" -H "osd-xsrf: true" -H "Content-Type: application/json" -d "{\"username\":\"admin\",\"password\":\"Ci-only-admin-1.\"}" https://127.0.0.1/auth/login' | grep -qx 200
      # New passwords replace the old ones on the next apply.
      - name: Change the passwords with a second apply
        working-directory: examples/local
        env:
          TF_VAR_admin_password: Ci-only-admin-2.
          TF_VAR_api_password: Ci-only-api-2.
        run: |
          sudo podman exec circuit-wazuh-server sh -ec '
            install -d /root/kept
            d=/usr/share/wazuh-dashboard/data/wazuh
            rm -rf $d/config
            ln -s /root/kept $d/config
          '
          conn3x apply -auto-approve
          conn3x plan -detailed-exitcode
          # A link in the dashboard's data directory leaves where it points as it was.
          sudo podman exec circuit-wazuh-server sh -ec '
            [ "$(stat -c "%U:%G %a" /root/kept)" = "root:root 755" ]
            [ -z "$(ls -A /root/kept)" ]
            [ "$(stat -c "%U:%G %a" /usr/share/wazuh-dashboard/data/wazuh/config/wazuh.yml)" = "wazuh-dashboard:wazuh-dashboard 600" ]
          '
      - name: Check again with the new passwords
        env:
          ADMIN_PASSWORD: Ci-only-admin-2.
          API_PASSWORD: Ci-only-api-2.
        run: test/check.sh
      - name: Check the old passwords are refused and state holds no secrets
        working-directory: examples/local
        run: |
          sudo podman exec circuit-wazuh-server sh -c "curl -sk -o /dev/null -w '%{http_code}' -u wazuh:Ci-only-api-1. -X POST https://127.0.0.1:55000/security/user/authenticate" | grep -qx 401
          sudo podman exec circuit-wazuh-server sh -c "curl -sk -o /dev/null -w '%{http_code}' -u admin:Ci-only-admin-1. https://127.0.0.1:9200/" | grep -qx 401
          if grep -qE 'Ci-only-|ci-only-|PRIVATE KEY|Wui\.[0-9a-f]' terraform.tfstate; then exit 1; fi
      - name: Show the logs
        if: failure()
        run: |
          sudo podman exec circuit-wazuh-server journalctl -u wazuh-indexer -u wazuh-manager -u wazuh-dashboard -u filebeat --no-pager -n 100 || true
          sudo podman exec circuit-wazuh-agent tail -n 50 /var/ossec/logs/ossec.log || true
      - name: Clean up
        if: always()
        working-directory: examples/local
        run: ./down.sh
